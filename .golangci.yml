# $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
linters:
  enable:
    - bodyclose
    - contextcheck
    - errname
    - errorlint
    - godot
    - misspell
    - nilerr
    - revive
    - tparallel
    - unparam
    - whitespace
  settings:
    revive:
      rules:
        # Every exported identifier needs a doc comment.
        - name: exported
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

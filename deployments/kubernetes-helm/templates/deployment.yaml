apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "csp-collector.fullname" . }}
  labels:
    {{- include "csp-collector.labels" . | nindent 4 }}
    checksum/config: {{ include (print $.Template.BasePath "/configMap.yaml") . | sha256sum | trunc 63 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "csp-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        {{- with .Values.metrics.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configMap.yaml") . | sha256sum | trunc 63 }}
      labels:
        {{- include "csp-collector.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "csp-collector.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
          - name: config-volume
            mountPath: /configs
          command:
            - "/csp_collector"
          args:
          {{- if .Values.custom.jsonOutput }}
            - "--output-format"
            - "json"
          {{- end }}
          {{- if .Values.custom.filterlist }}
            - "--filter-file"
            - "/configs/{{- .Values.custom.filterlist -}}"
          {{- end }}
          {{- if .Values.custom.debug }}
            - "--debug"
          {{- end }}
          {{- if .Values.metrics.enabled }}
            - "--metrics-bind-addr"
            - {{ .Values.metrics.bindAddress | quote }}
            - "--metrics-port"
            - {{ .Values.metrics.port | quote }}
          {{- else }}
          {{- /* The image's default args bind metrics to every interface. */}}
            - "--metrics-bind-addr"
            - "127.0.0.1"
          {{- end }}
          {{- if .Values.custom.filterDomainsFile }}
            - "--filter-domains-file"
            - "/configs/{{- .Values.custom.filterDomainsFile -}}"
          {{- end }}
          {{- if .Values.custom.healthCheckPath }}
            - "--health-check-path"
            - {{ .Values.custom.healthCheckPath | quote }}
          {{- end }}
          {{- if .Values.custom.truncateQueryFragment }}
            - "--truncate-query-fragment"
          {{- end }}
          {{- if .Values.custom.logClientIP }}
            - "--log-client-ip"
          {{- end }}
          {{- if .Values.custom.logTruncatedClientIP }}
            - "--log-truncated-client-ip"
          {{- end }}
          {{- if .Values.custom.queryParamsMetadata }}
            - "--query-params-metadata"
          {{- end }}
          {{- if .Values.custom.endpoints }}
            - "--endpoints"
            - {{ .Values.custom.endpoints | quote }}
          {{- end }}
          {{- if dig "limits" "memory" "" .Values.resources }}
          {{- /*
            Go doesn't read the container's memory limit, so without this the
            heap can grow until the pod is OOM killed instead of the garbage
            collector working harder as it nears the limit.
          */}}
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.custom.healthCheckPath | default "/_healthcheck" | quote }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ .Values.custom.healthCheckPath | default "/_healthcheck" | quote }}
              port: http
          resources:
{{ toYaml .Values.resources | indent 12 }}
    {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
      volumes:
      - name: config-volume
        configMap:
          name: {{ template "csp-collector.fullname" . }}
    {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.securityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
    {{- end }}

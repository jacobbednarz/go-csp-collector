# Default values for csp-collector.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: jacobbednarz/go-csp-collector
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8080
  metrics:
    enabled: false
    port: 9090
  annotations: {}

metrics:
  enabled: true
  bindAddress: 0.0.0.0
  port: 9090
  path: /metrics
  podAnnotations: {}

custom:
  # filterlist is either false, to use the built in filter list,
  #  or the path within the configMaps directly without any prefixes. Eg
  # filterlist: 'filterlist.txt'
  filterlist: false
  # filterDomainsFile is either false, to disable domain filtering,
  #  or the path within the configMaps directly without any prefixes. Eg
  # filterDomainsFile: 'domainlist.txt'
  filterDomainsFile: false
  # Log Json Output
  jsonOutput: true
  debug: false
  # Truncate query string and fragment from document-uri, referrer and
  # blocked-uri before logging (reduces risk of logging sensitive data).
  truncateQueryFragment: false
  # Log the (full) reporting client IP address with each report.
  logClientIP: false
  # Log the truncated reporting client IP address (IPv4 /24, IPv6 /64).
  # Can't be combined with logClientIP; the collector refuses to start.
  logTruncatedClientIP: false
  # Write query parameters of the report URI as a JSON object under the
  # metadata field instead of as a single metadata string.
  queryParamsMetadata: false
  # Override the default /_healthcheck endpoint path. Empty (default) keeps
  # the collector default.
  healthCheckPath: ""
  # Comma separated endpoint groups to serve. See "Disabling endpoints" in
  # the collector README for the groups.
  # Empty (default) serves all of them. Eg
  # endpoints: "csp,reporting-api-csp"
  endpoints: ""

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  path: /
  hosts:
    - chart-example.local
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Setting a memory limit also sets GOMEMLIMIT to it, so the collector's
# garbage collector works harder near the limit rather than being OOM killed.
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# The collector only writes to stdout and binds unprivileged ports, so it
# runs with no capabilities and a read-only root filesystem. runAsUser is
# set for image tags from before the image switched to a numeric USER.
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

securityContext: {}
  # fsGroup: 2000
